<!doctype html><html lang="es"><head><title>Valdoria - Registro DM</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>Registro de movimientos</h2>
<a href="dm.html">← Volver al panel de jugadores</a>
<div id="msg" class="err"></div>
<select id="fu" onchange="cargar()"></select>
<select id="ft" onchange="cargar()"><option value="">Todos los tipos</option><option value="compra">🛒 Compras</option><option value="regalo">🎁 Regalos entre jugadores</option><option value="descarte">🗑 Descartes</option><option value="oro">💰 Oro entre jugadores / tirado</option><option value="dm">👑 Acciones del DM</option></select>
<small>Se muestran los últimos 200 movimientos.</small>
<div id="lista"></div>
</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const IC={compra:'🛒',regalo:'🎁',descarte:'🗑',oro:'💰',dm:'👑'};
async function iniciar(){
 const{data}=await sb.from('profiles').select('id,username').order('username');
 fu.innerHTML='<option value="">Todos los jugadores</option>'+(data||[]).map(u=>'<option value="'+u.id+'">'+esc(u.username)+'</option>').join('');
 cargar()}
async function cargar(){
 let q=sb.from('registro').select('*').order('id',{ascending:false}).limit(200);
 if(fu.value)q=q.eq('usuario_id',fu.value);
 if(ft.value)q=q.eq('tipo',ft.value);
 const{data,error}=await q;
 if(error){msg.textContent=error.message;return}
 lista.innerHTML=(data||[]).map(r=>'<div class="box"><small>'+new Date(r.fecha).toLocaleString('es-AR')+'</small><br>'+(IC[r.tipo]||'•')+' <b>'+esc(r.usuario)+'</b>: '+esc(r.detalle)+'</div>').join('')||'<i>Todavía no hay movimientos.</i>'}
(async()=>{const p=await cabecera('Registro DM');if(!p)return;if(!p.is_dm){location.href='main.html';return}iniciar()})();
</script></body></html>
