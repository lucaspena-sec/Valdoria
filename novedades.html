<!doctype html><html lang="es"><head><title>Valdoria - Novedades</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<div class="diario">
<div class="cab"><h1>El Heraldo de Valdoria</h1><small>Edición de la mañana · Un cobre el ejemplar</small></div>
<div class="notas" id="notas"><i>Cargando…</i></div>
</div></div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function cargar(){
 const{data}=await sb.from('noticias').select('*').eq('publicada',true).order('fecha',{ascending:false});
 notas.innerHTML=(data||[]).map(n=>'<div class="nota"><h3>'+esc(n.titulo)+'</h3><small>'+esc(n.seccion)+(n.seccion?' · ':'')+new Date(n.fecha).toLocaleDateString('es-AR')+'</small><p style="white-space:pre-wrap">'+esc(n.texto)+'</p></div>').join('')||'<i>No hay noticias por ahora.</i>';
}
cabecera('Novedades');cargar();
</script></body></html>
