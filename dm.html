<!doctype html><html lang="es"><head><title>Valdoria - Panel DM</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=23"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js?v=14"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>Panel del DM</h2>
<div class="navdm"><a class="btn" href="dm-catalogo.html">📚 Catálogo</a><a class="btn" href="dm-criaturas.html">🐺 Criaturas</a><a class="btn" href="dm-escenarios.html">🎬 Escenarios</a><a class="btn" href="dm-novedades.html">📰 Novedades</a><a class="btn" id="nvReg" href="dm-registro.html">📋 Registro</a><button id="nvResp" onclick="respaldo()">💾 Copia de seguridad</button><button id="nvRest" onclick="rsf.click()">📥 Restaurar copia</button><input type="file" id="rsf" accept=".json,application/json" style="display:none" onchange="restaurarCopia(this)"></div>
<div id="msg" class="err"></div>
<div id="cpAviso" class="box" style="display:none"></div>
<div id="rsOut"></div>
<div id="mesaBox" class="box" style="display:none"></div>
<div id="accBox" class="box" style="display:none"></div>
<div id="noDir" class="box" style="display:none">🎬 Ahora dirige la mesa otro DM. Mientras tanto podés crear y preparar tu contenido (catálogo, criaturas, escenarios) desde los botones de arriba.</div>
<div id="jug"><div class="box"><input id="bj" placeholder="Buscar jugador" oninput="pintar()"><button onclick="ojos(true)">Ocultar todos</button> <button onclick="ojos(false)">Mostrar todos</button></div>
<details class="box"><summary><b>🔎 Filtros para dar ítems del catálogo</b> <small id="fcnt"></small></summary>
<input id="bi" placeholder="Buscar ítem por nombre" oninput="filtrarSel()">
<div class="chk" id="fcat"></div><div class="chk" id="frar"></div></details>
<div id="lista"></div></div>
</div></div>
<script>
let FI=[],US=[],INV=[],IT=[],OC=new Set();
const CAT={armas:'Armas',armaduras:'Armaduras',escudos:'Escudos',consumibles:'Consumibles',accesorios:'Accesorios',pergaminos:'Pergaminos',valiosos:'Objetos valiosos'};
const RAR={comun:'Comunes',infrecuente:'Infrecuentes',rara:'Raras',epica:'Épicas',legendaria:'Legendarias'};
const PAL=['#c0392b','#2e86c1','#27ae60','#8e44ad','#d68910','#16a085','#b03a6f','#5d6d7e'];
const OJOA='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="#222"/></svg>';
const OJOC='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M2 11c3 5 7 7 10 7s7-2 10-7" fill="none" stroke="#222" stroke-width="2"/><path d="M5 16l-2 3M12 18v3M19 16l2 3" stroke="#222" stroke-width="2"/></svg>';
fcat.innerHTML='<b>Categoría:</b> '+Object.keys(CAT).map(k=>'<label><input type="checkbox" data-t="cat" value="'+k+'" onchange="filtrarSel()" style="width:auto"> '+CAT[k]+'</label>').join('');
frar.innerHTML='<b>Rareza:</b> '+Object.keys(RAR).map(k=>'<label><input type="checkbox" data-t="rar" value="'+k+'" onchange="filtrarSel()" style="width:auto"> '+RAR[k]+'</label>').join('');
const color=n=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
async function cargar(){
 const[u,i,t,fi,oc]=await Promise.all([sb.from('profiles').select('*').order('username'),sb.from('inventario').select('*').order('nombre'),sb.from('items').select('id,nombre,categoria,rareza').order('nombre'),sb.from('fichas').select('user_id,hp,hp_max,hp_temp'),sb.from('dm_ocultos').select('jugador')]);
 US=u.data||[];INV=i.data||[];IT=t.data||[];FI=fi.data||[];OC=new Set((oc.data||[]).map(r=>r.jugador));pintar()}
function fichaHtml(x){const f=FI.find(z=>z.user_id==x.id);
 return '<div>'+(f?'❤ HP '+f.hp+'/'+f.hp_max+(f.hp_temp?' (+'+f.hp_temp+' temp)':''):'<i>Sin ficha todavía</i>')+' · ✦ Inspiración: <b>'+(x.inspiracion||0)+'</b> <button onclick="insp(\''+x.id+'\',-1)">−</button><button onclick="insp(\''+x.id+'\',1)">+</button><br>'+
  '<input type="number" id="h'+x.id+'" min="1" placeholder="Puntos de vida"><button onclick="hp(\''+x.id+'\',-1)">Daño</button> <button onclick="hp(\''+x.id+'\',1)">Curar</button> <a href="ficha.html?u='+x.id+'">Ver ficha</a></div>'}
function tarjeta(x,m){const id=x.id,col=color(x.username),ocu=OC.has(id);
 const cab='<div class="pcab"><span class="pname" style="background:'+col+'">'+esc(x.username)+(x.nombre&&x.nombre!==x.username&&!x.is_dm?' · 🧙 '+esc(x.nombre):'')+(x.is_dm?' (DM)':'')+'</span>'+(m?(x.es_actual?' <span class="pto">✅ activo</span>':' <span class="pto">💤 inactivo</span>'):'')+'<button class="eye" title="'+(ocu?'Mostrar datos':'Ocultar datos')+'" onclick="ojo(\''+id+'\')">'+(ocu?OJOC:OJOA)+'</button><b>💰 '+x.gold+' po</b></div>';
 if(ocu)return '<div class="pcard ocu" style="--pc:'+col+'">'+cab+'</div>';
 const its=INV.filter(y=>y.user_id==id);
 return '<div class="pcard" style="--pc:'+col+'">'+cab+
  '<input type="number" id="m'+id+'" placeholder="Cantidad de oro" min="0">'+
  '<button onclick="oro(\''+id+'\',1)">Dar</button> <button onclick="oro(\''+id+'\',-1)">Quitar</button> <button onclick="fijar(\''+id+'\')">Fijar total</button>'+
  fichaHtml(x)+
  '<details id="it'+id+'"><summary>Ítems ('+its.length+')</summary>'+(its.map(y=>esc(y.nombre)+(y.cantidad>1?' ×'+y.cantidad:'')+' ('+y.lugar+')').join('<br>')||'<i>Vacío</i>')+'</details>'+
  '<select id="l'+id+'"><option value="cofre">Al cofre</option><option value="mochila">A la mochila</option></select><br>'+
  '<select class="cat" id="c'+id+'"></select> <input type="number" id="q'+id+'" min="1" max="99" value="1" title="Cantidad" style="width:64px"> <button onclick="regalarCat(\''+id+'\')">Dar del catálogo</button><br>'+
  '<input id="n'+id+'" placeholder="O un ítem suelto: nombre"><input id="d'+id+'" placeholder="Descripción"><button onclick="regalar(\''+id+'\')">Dar ítem suelto</button></div>'}
function grupoHtml(g){
 const m=g.vivos.length>1||g.bor.length>0,col=color(g.u);
 let h=g.vivos.length?tarjeta(g.vivos[0],m):'<div class="pcard ocu" style="--pc:'+col+'"><div class="pcab"><span class="pname" style="background:'+col+'">'+esc(g.u)+'</span> <i>sin personaje activo</i></div></div>';
 const otros=g.vivos.slice(1);
 if(otros.length)h+='<details id="oc'+g.cid+'" class="box"><summary><b>🧙 Otros personajes de '+esc(g.u)+' ('+otros.length+')</b></summary>'+otros.map(x=>tarjeta(x,true)).join('')+'</details>';
 if(g.bor.length)h+='<details id="bo'+g.cid+'" class="box"><summary><b>🗑 Borrados de '+esc(g.u)+' ('+g.bor.length+')</b></summary>'+g.bor.map(x=>'<div class="fila" style="flex-wrap:wrap"><span>'+esc(x.nombre||x.username)+' <small>💰 '+x.gold+' po · borrado el '+new Date(x.borrado_en).toLocaleDateString('es-AR')+'</small></span> <button onclick="restaurar(\''+x.id+'\')">↩ Restaurar</button> <button onclick="eliminar(\''+x.id+'\')">❌ Eliminar</button></div>').join('')+'<small>Restaurar lo devuelve al jugador. Eliminar lo borra del todo con su ficha, ítems y oro.</small></details>';
 return h}
function pintar(){
 const gd={},ab=[...document.querySelectorAll('#lista details[open]')].map(d=>d.id);
 document.querySelectorAll('#lista input,#lista select:not(.cat)').forEach(e=>{if(e.id)gd[e.id]=e.value});
 const b=bj.value.trim().toLowerCase(),G={};
 US.forEach(x=>{(G[x.cuenta_id]=G[x.cuenta_id]||[]).push(x)});
 const gr=Object.entries(G).map(([cid,a])=>{
  const vivos=a.filter(x=>!x.borrado_en).sort((p,q)=>Number(!!q.es_actual)-Number(!!p.es_actual)||String(p.creado).localeCompare(String(q.creado))),bor=a.filter(x=>x.borrado_en);
  return{cid,u:a[0].username,vivos,bor,act:vivos[0]}})
  .filter(g=>!b||g.u.toLowerCase().includes(b)||g.vivos.concat(g.bor).some(x=>(x.nombre||'').toLowerCase().includes(b)));
 const oc=g=>g.act&&OC.has(g.act.id)?1:0;
 gr.sort((p,q)=>oc(p)-oc(q)||p.u.localeCompare(q.u));
 lista.innerHTML=gr.map(grupoHtml).join('')||'<i>No hay jugadores.</i>';
 Object.keys(gd).forEach(k=>{const e=document.getElementById(k);if(e)e.value=gd[k]});
 ab.forEach(k=>{const e=document.getElementById(k);if(e)e.open=true});
 filtrarSel()}
function filtrarSel(){
 const c=[...document.querySelectorAll('[data-t=cat]:checked')].map(e=>e.value),r=[...document.querySelectorAll('[data-t=rar]:checked')].map(e=>e.value),b=bi.value.trim().toLowerCase();
 const f=IT.filter(i=>(!c.length||c.includes(i.categoria))&&(!r.length||r.includes(i.rareza))&&(!b||i.nombre.toLowerCase().includes(b)));
 const o=f.map(i=>'<option value="'+i.id+'">'+esc(i.nombre)+' ['+CAT[i.categoria]+' / '+i.rareza+']</option>').join('')||'<option value="">(sin resultados)</option>';
 document.querySelectorAll('select.cat').forEach(s=>{const v=s.value;s.innerHTML=o;if([...s.options].some(x=>x.value==v))s.value=v});
 fcnt.textContent='('+f.length+' coinciden)'}
async function ojo(id){const ocu=OC.has(id);
 const{error}=ocu?await sb.from('dm_ocultos').delete().eq('jugador',id):await sb.from('dm_ocultos').insert({jugador:id});
 if(error){msg.textContent=error.message;return}ocu?OC.delete(id):OC.add(id);pintar()}
async function ojos(ocultar){const ids=US.filter(u=>!u.borrado_en).map(u=>u.id);
 const{error}=ocultar?await sb.from('dm_ocultos').upsert(ids.map(j=>({jugador:j}))):await sb.from('dm_ocultos').delete().in('jugador',ids);
 if(error){msg.textContent=error.message;return}OC=ocultar?new Set(ids):new Set();pintar()}
async function respaldo(){const r=await sb.rpc('respaldo_dm');if(r.error){msg.textContent=r.error.message+' — ¿corriste setup_subdm_c.sql?';return}const o={fecha:new Date().toISOString(),...r.data};
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
 a.download='valdoria-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click();avisoCopia()}
async function avisoCopia(){
 const{data,error}=await sb.from('registro').select('fecha').eq('tipo','copia').order('id',{ascending:false}).limit(1);
 if(error)return;
 const f=data&&data[0]?new Date(data[0].fecha):null,d=f?Math.floor((Date.now()-f)/864e5):null;
 if(f&&d<7){cpAviso.style.display='none';return}
 cpAviso.style.display='block';
 cpAviso.innerHTML='💾 '+(f?'Hace <b>'+d+' día'+(d==1?'':'s')+'</b> que no hacés una copia de seguridad.':'Todavía no hay copias de seguridad registradas.')+' <button onclick="respaldo()">Hacer copia ahora</button>'}
const g=id=>document.getElementById(id).value;
const RS_ORDEN=[['profiles','Jugadores (perfiles)'],['fichas','Fichas'],['inventario','Inventarios'],['items','Ítems del catálogo'],['mercaderes','Mercaderes'],['oferta','Ofertas de mercaderes'],['criaturas','Criaturas'],['encuentros','Encuentros'],['noticias','Noticias'],['alertas','Alertas'],['loots','Loots'],['escenarios','Escenarios'],['escenas','Escenas'],['subdms','Sub-DMs'],['conjuros_biblioteca','Biblioteca de conjuros']];
async function restaurarCopia(inp){
 const f=inp.files[0];inp.value='';if(!f)return;
 let o;try{o=JSON.parse(await f.text())}catch(e){msg.className='err';msg.textContent='Ese archivo no es una copia válida (no se pudo leer el JSON).';return}
 const hay=RS_ORDEN.filter(([t])=>Array.isArray(o[t])&&o[t].length);
 if(!hay.length){msg.className='err';msg.textContent='La copia no tiene datos para restaurar.';return}
 const fecha=o.fecha?new Date(o.fecha).toLocaleString('es-AR'):'(sin fecha)';
 if(!confirm('Copia del '+fecha+':\n\n'+hay.map(([t,n])=>'• '+n+': '+o[t].length).join('\n')+'\n\nSolo se agrega lo que FALTA: lo que ya existe no se toca. Las cuentas (usuarios y claves) tienen que existir; lo que dependa de una cuenta que no está se omite.\n\n¿Restaurar?'))return;
 msg.className='ok';const res=[];
 for(const [t,n] of hay){
  let ins=0,om=0,mot='';
  for(let i=0;i<o[t].length;i+=200){
   msg.textContent='Restaurando '+n+'… '+Math.min(i+200,o[t].length)+' de '+o[t].length;
   const{data,error}=await sb.rpc('restaurar_tabla',{p_tabla:t,p_filas:o[t].slice(i,i+200)});
   if(error){msg.className='err';msg.textContent=n+': '+error.message+' — ¿corriste setup_restaurar.sql? Se frenó acá.';rsOut.innerHTML=resumenRS(res);return}
   ins+=data.ins;om+=data.omit;if(!mot&&data.motivo)mot=data.motivo}
  res.push([n,ins,om,mot])}
 await sb.rpc('restaurar_anotar',{p_detalle:res.map(r=>r[0]+' +'+r[1]).join(', ')});
 msg.className='ok';msg.textContent='Listo. Esto fue lo que se hizo:';rsOut.innerHTML=resumenRS(res);cargar()}
function resumenRS(res){return '<div class="box">'+res.map(r=>'<div>'+esc(r[0])+': <b>'+r[1]+' agregadas</b>'+(r[2]?' · '+r[2]+' omitidas (ya existían o les falta algo)':'')+(r[3]?'<br><small>Primer motivo: '+esc(r[3])+'</small>':'')+'</div>').join('')+'</div>'}
function val(id){const v=parseInt(g('m'+id));if(!(v>=0)){msg.textContent='Escribí una cantidad válida.';return null}msg.textContent='';return v}
async function fin(error){msg.textContent=error?error.message:'';cargar()}
async function oro(id,s){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_oro',{p_user:id,p_delta:s*v})).error)}
async function fijar(id){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_fijar_oro',{p_user:id,p_oro:v})).error)}
async function regalar(id){const n=g('n'+id).trim();if(!n){msg.textContent='Escribí el nombre del ítem.';return}
 fin((await sb.rpc('dm_dar_item',{p_user:id,p_nombre:n,p_desc:g('d'+id).trim(),p_lugar:g('l'+id)})).error)}
async function regalarCat(id){const it=parseInt(g('c'+id));if(!it){msg.textContent='Elegí un ítem de la lista.';return}
 const q=Math.min(99,Math.max(1,parseInt(g('q'+id))||1)),a={p_user:id,p_item:it,p_lugar:g('l'+id)};if(q>1)a.p_cant=q;fin((await sb.rpc('dm_dar_catalogo',a)).error)}
async function hp(id,s){const v=parseInt(g('h'+id));if(!(v>0)){msg.textContent='Escribí un número mayor a 0.';return}fin((await sb.rpc('dm_hp',{p_user:id,p_delta:s*v})).error)}
async function restaurar(id){fin((await sb.rpc('restaurar_personaje',{p_id:id})).error)}
async function eliminar(id){const x=US.find(u=>u.id==id);if(!x||!confirm('¿Eliminar DEFINITIVAMENTE a “'+(x.nombre||x.username)+'” con su ficha, ítems y oro? No se puede deshacer.'))return;fin((await sb.rpc('eliminar_personaje',{p_id:id})).error)}
async function insp(id,d){fin((await sb.rpc('dm_inspiracion',{p_user:id,p_delta:d})).error)}
let ROL=null,SUBS=[];
async function cargarMesa(){const[a,b]=await Promise.all([sb.rpc('mi_rol'),sb.rpc('subdms_lista')]);if(a.error)return;ROL=a.data;SUBS=b.data||[];pintarMesa()}
function pintarMesa(){if(!ROL||!ROL.master)return;mesaBox.style.display='block';
 const cu={};US.filter(u=>!u.borrado_en&&!u.is_dm).forEach(u=>{if(!cu[u.cuenta_id])cu[u.cuenta_id]=u.username});
 let h='<b>🎬 Mesa dirigida por:</b> '+(ROL.director?'🎭 '+esc(ROL.director_nombre||'?'):'👑 DM principal');
 if(!ROL.dm){if(ROL.dirige)h+=' <button onclick="mesa(null)">↩ Devolver el control al DM</button>';mesaBox.innerHTML=h;return}
 const subs=Object.entries(cu).filter(([c])=>SUBS.includes(c));
 h+='<br><select id="mesaSel"><option value="">👑 DM principal (yo)</option>'+subs.map(([c,n])=>'<option value="'+c+'"'+(c==ROL.director?' selected':'')+'>🎭 '+esc(n)+'</option>').join('')+'</select> <button onclick="mesa(g(\'mesaSel\')||null)">Cambiar</button>'+
  '<details><summary><b>🎭 Sub-DMs</b> ('+subs.length+')</summary>'+Object.entries(cu).sort((a,b)=>a[1].localeCompare(b[1])).map(([c,n])=>'<div class="fila"><span>'+esc(n)+'</span><button style="margin-left:auto" onclick="subdm(\''+c+'\','+!SUBS.includes(c)+')">'+(SUBS.includes(c)?'Quitar rol':'Hacer sub-DM')+'</button></div>').join('')+'<small>Un sub-DM crea y comparte contenido y, cuando le pasás la mesa, la dirige. No puede borrar personajes ni ver el Registro.</small></details>'+(ROL.espia?'<br>🕵 Modo espía activo <button onclick="espiaOff()">Desactivar</button>':'<br><button onclick="espiar()">🕵 Ver contenido no compartido</button> <small>(30 min, solo lectura, queda en el Registro)</small>');
 mesaBox.innerHTML=h}
let ACC=null,SOL=[];
async function cargarAcc(){const[a,b]=await Promise.all([sb.rpc('acceso_ver'),sb.rpc('solicitudes_lista')]);if(a.error)return;ACC=a.data;SOL=b.data||[];pintarAcc()}
function pintarAcc(){accBox.style.display='block';
 const cu={};US.filter(u=>!u.borrado_en).forEach(u=>{if(!cu[u.cuenta_id])cu[u.cuenta_id]=u.username});
 accBox.innerHTML='<details'+(SOL.length?' open':'')+'><summary><b>🚪 Acceso y solicitudes</b> '+(SOL.length?'<span class="pto">🔔 '+SOL.length+' pendiente'+(SOL.length==1?'':'s')+'</span>':'')+'</summary>'+
  '<h4>Código de acceso</h4><input id="acCod" value="'+esc(ACC.codigo||'')+'" placeholder="Código para crear cuentas"><label><input type="checkbox" id="acAb" style="width:auto" '+(ACC.abierto?'checked':'')+'> Registro abierto</label> <button onclick="accGuardar()">Guardar</button><br><small>Pasales este código a tus jugadores. Con el registro cerrado nadie puede crear cuenta.</small>'+
  '<h4>Solicitudes de ingreso</h4>'+(SOL.map(s=>'<div class="fila"><span><b>'+esc(s.username)+'</b> <small>'+new Date(s.creado).toLocaleString('es-AR')+'</small></span><span style="margin-left:auto"><button onclick="solAcep(\''+s.cuenta_id+'\')">✅ Aceptar</button> <button onclick="solRech(\''+s.cuenta_id+'\')">❌ Rechazar</button></span></div>').join('')||'<i>No hay solicitudes pendientes.</i>')+
  '<h4>🔑 Cuentas: clave y eliminación</h4><select id="rcCta">'+Object.entries(cu).sort((a,b)=>a[1].localeCompare(b[1])).map(([c,n])=>'<option value="'+c+'">'+esc(n)+'</option>').join('')+'</select> <input id="rcClave" placeholder="Clave nueva (vacío = generar una)"> <button onclick="rcAplicar()">Restablecer clave</button> <button onclick="cuentaDel()">🗑 Eliminar cuenta</button><div id="rcOut"></div><small>Se cierran sus sesiones y, al entrar, tiene que elegir una clave nueva. Las claves actuales no se pueden ver: solo reemplazar.</small></details>'}
async function cuentaDel(){const c=g('rcCta'),nom=rcCta.selectedOptions[0].text;
 const t=prompt('Vas a ELIMINAR la cuenta "'+nom+'" con todos sus personajes, fichas, ítems y oro. No se puede deshacer.\n\nPara confirmar, escribí su nombre de usuario:');
 if(t===null)return;
 if(t.trim().toLowerCase()!==nom.toLowerCase()){msg.className='err';msg.textContent='El nombre no coincide: no se eliminó nada.';return}
 const{data,error}=await sb.rpc('dm_eliminar_cuenta',{p_cuenta:c});
 msg.className=error?'err':'ok';msg.textContent=error?error.message:'Cuenta "'+nom+'" eliminada ('+((data&&data.personajes)||0)+' personaje(s)).';
 await cargar();cargarAcc();cargarMesa()}
async function accGuardar(){const{error}=await sb.rpc('acceso_fijar',{p_codigo:g('acCod'),p_abierto:acAb.checked});msg.className=error?'err':'ok';msg.textContent=error?error.message:'Guardado.';cargarAcc()}
async function solAcep(c){const{error}=await sb.rpc('solicitud_aceptar',{p_cuenta:c});msg.className='err';msg.textContent=error?error.message:'';await cargar();cargarAcc()}
async function solRech(c){if(!confirm('¿Rechazar esta solicitud? Se borra la cuenta y el nombre queda libre.'))return;const{error}=await sb.rpc('solicitud_rechazar',{p_cuenta:c});msg.className='err';msg.textContent=error?error.message:'';cargarAcc()}
async function rcAplicar(){const c=g('rcCta'),nom=rcCta.selectedOptions[0].text;let k=g('rcClave').trim();
 if(k&&k.length<6){msg.className='err';msg.textContent='La clave necesita 6 caracteres o más.';return}
 if(!k){const A='abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789',r=new Uint32Array(8);crypto.getRandomValues(r);k=[...r].map(x=>A[x%A.length]).join('')}
 if(!confirm('¿Restablecer la clave de '+nom+'?\n\nSe cierran sus sesiones abiertas y tendrá que elegir una clave nueva al entrar.'))return;
 const{error}=await sb.rpc('dm_reset_clave',{p_cuenta:c,p_clave:k});msg.className='err';if(error){msg.textContent=error.message;return}
