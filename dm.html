<!doctype html><html lang="es"><head><title>Valdoria - Panel DM</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=6"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js?v=6"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>Panel del DM</h2>
<div class="navdm"><a class="btn" href="dm-catalogo.html">📚 Catálogo</a><a class="btn" href="dm-criaturas.html">🐺 Criaturas</a><a class="btn" href="dm-novedades.html">📰 Novedades</a><a class="btn" href="dm-registro.html">📋 Registro</a><button onclick="respaldo()">💾 Copia de seguridad</button></div>
<div id="msg" class="err"></div>
<div class="box"><input id="bj" placeholder="Buscar jugador" oninput="pintar()"><button onclick="ojos(true)">Ocultar todos</button> <button onclick="ojos(false)">Mostrar todos</button></div>
<details class="box"><summary><b>🔎 Filtros para dar ítems del catálogo</b> <small id="fcnt"></small></summary>
<input id="bi" placeholder="Buscar ítem por nombre" oninput="filtrarSel()">
<div class="chk" id="fcat"></div><div class="chk" id="frar"></div></details>
<div id="lista"></div>
</div></div>
<script>
let FI=[],US=[],INV=[],IT=[],OC=new Set();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const CAT={armas:'Armas',armaduras:'Armaduras',escudos:'Escudos',consumibles:'Consumibles',accesorios:'Accesorios',pergaminos:'Pergaminos',valiosos:'Objetos valiosos'};
const RAR={comun:'Comunes',infrecuente:'Infrecuentes',rara:'Raras',epica:'Épicas',legendaria:'Legendarias'};
const PAL=['#c0392b','#2e86c1','#27ae60','#8e44ad','#d68910','#16a085','#b03a6f','#5d6d7e'];
const OJOA='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="#222"/></svg>';
const OJOC='<svg width="22" height="22" viewBox="0 0 24 24"><path d="M2 11c3 5 7 7 10 7s7-2 10-7" fill="none" stroke="#222" stroke-width="2"/><path d="M5 16l-2 3M12 18v3M19 16l2 3" stroke="#222" stroke-width="2"/></svg>';
fcat.innerHTML='<b>Categoría:</b> '+Object.keys(CAT).map(k=>'<label><input type="checkbox" data-t="cat" value="'+k+'" onchange="filtrarSel()" style="width:auto"> '+CAT[k]+'</label>').join('');
frar.innerHTML='<b>Rareza:</b> '+Object.keys(RAR).map(k=>'<label><input type="checkbox" data-t="rar" value="'+k+'" onchange="filtrarSel()" style="width:auto"> '+RAR[k]+'</label>').join('');
const color=n=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
async function cargar(){
 const[u,i,t,fi,oc]=await Promise.all([sb.from('profiles').select('*').order('username'),sb.from('inventario').select('*').order('nombre'),sb.from('items').select('id,nombre,categoria,rareza').order('nombre'),sb.from('fichas').select('user_id,hp,hp_max,hp_temp'),sb.from('dm_ocultos').select('jugador')]);
 US=u.data||[];INV=i.data||[];IT=t.data||[];FI=fi.data||[];OC=new Set((oc.data||[]).map(r=>r.jugador));pintar()}
function fichaHtml(x){const f=FI.find(z=>z.user_id==x.id);
 return '<div>'+(f?'❤ HP '+f.hp+'/'+f.hp_max+(f.hp_temp?' (+'+f.hp_temp+' temp)':''):'<i>Sin ficha todavía</i>')+' · ✦ Inspiración: <b>'+(x.inspiracion||0)+'</b> <button onclick="insp(\''+x.id+'\',-1)">−</button><button onclick="insp(\''+x.id+'\',1)">+</button><br>'+
  '<input type="number" id="h'+x.id+'" min="1" placeholder="Puntos de vida"><button onclick="hp(\''+x.id+'\',-1)">Daño</button> <button onclick="hp(\''+x.id+'\',1)">Curar</button> <a href="ficha.html?u='+x.id+'">Ver ficha</a></div>'}
function tarjeta(x){const id=x.id,col=color(x.username),ocu=OC.has(id);
 const cab='<div class="pcab"><span class="pname" style="background:'+col+'">'+esc(x.username)+(x.is_dm?' (DM)':'')+'</span><button class="eye" title="'+(ocu?'Mostrar datos':'Ocultar datos')+'" onclick="ojo(\''+id+'\')">'+(ocu?OJOC:OJOA)+'</button><b>💰 '+x.gold+' po</b></div>';
 if(ocu)return '<div class="pcard ocu" style="--pc:'+col+'">'+cab+'</div>';
 const its=INV.filter(y=>y.user_id==id);
 return '<div class="pcard" style="--pc:'+col+'">'+cab+
  '<input type="number" id="m'+id+'" placeholder="Cantidad de oro" min="0">'+
  '<button onclick="oro(\''+id+'\',1)">Dar</button> <button onclick="oro(\''+id+'\',-1)">Quitar</button> <button onclick="fijar(\''+id+'\')">Fijar total</button>'+
  fichaHtml(x)+
  '<details id="it'+id+'"><summary>Ítems ('+its.length+')</summary>'+(its.map(y=>esc(y.nombre)+' ('+y.lugar+')').join('<br>')||'<i>Vacío</i>')+'</details>'+
  '<select id="l'+id+'"><option value="cofre">Al cofre</option><option value="mochila">A la mochila</option></select><br>'+
  '<select class="cat" id="c'+id+'"></select> <button onclick="regalarCat(\''+id+'\')">Dar del catálogo</button><br>'+
  '<input id="n'+id+'" placeholder="O un ítem suelto: nombre"><input id="d'+id+'" placeholder="Descripción"><button onclick="regalar(\''+id+'\')">Dar ítem suelto</button></div>'}
function pintar(){
 const gd={},ab=[...document.querySelectorAll('#lista details[open]')].map(d=>d.id);
 document.querySelectorAll('#lista input,#lista select:not(.cat)').forEach(e=>{if(e.id)gd[e.id]=e.value});
 const b=bj.value.trim().toLowerCase(),l=US.filter(x=>!b||x.username.includes(b));
 lista.innerHTML=l.filter(x=>!OC.has(x.id)).concat(l.filter(x=>OC.has(x.id))).map(tarjeta).join('')||'<i>No hay jugadores.</i>';
 Object.keys(gd).forEach(k=>{const e=document.getElementById(k);if(e)e.value=gd[k]});
 ab.forEach(k=>{const e=document.getElementById(k);if(e)e.open=true});
 filtrarSel()}
function filtrarSel(){
 const c=[...document.querySelectorAll('[data-t=cat]:checked')].map(e=>e.value),r=[...document.querySelectorAll('[data-t=rar]:checked')].map(e=>e.value),b=bi.value.trim().toLowerCase();
 const f=IT.filter(i=>(!c.length||c.includes(i.categoria))&&(!r.length||r.includes(i.rareza))&&(!b||i.nombre.toLowerCase().includes(b)));
 const o=f.map(i=>'<option value="'+i.id+'">'+esc(i.nombre)+' ['+CAT[i.categoria]+' / '+i.rareza+']</option>').join('')||'<option value="">(sin resultados)</option>';
 document.querySelectorAll('select.cat').forEach(s=>{const v=s.value;s.innerHTML=o;if([...s.options].some(x=>x.value==v))s.value=v});
 fcnt.textContent='('+f.length+' coinciden)'}
async function ojo(id){const ocu=OC.has(id);
 const{error}=ocu?await sb.from('dm_ocultos').delete().eq('jugador',id):await sb.from('dm_ocultos').insert({jugador:id});
 if(error){msg.textContent=error.message;return}ocu?OC.delete(id):OC.add(id);pintar()}
async function ojos(ocultar){const ids=US.map(u=>u.id);
 const{error}=ocultar?await sb.from('dm_ocultos').upsert(ids.map(j=>({jugador:j}))):await sb.from('dm_ocultos').delete().in('jugador',ids);
 if(error){msg.textContent=error.message;return}OC=ocultar?new Set(ids):new Set();pintar()}
async function respaldo(){const o={fecha:new Date().toISOString()};
 for(const n of ['profiles','inventario','fichas','items','mercaderes','oferta','criaturas','noticias','alertas']){
  const{data,error}=await sb.from(n).select('*');if(error){msg.textContent=n+': '+error.message;return}o[n]=data}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,1)],{type:'application/json'}));
 a.download='valdoria-respaldo-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
const g=id=>document.getElementById(id).value;
function val(id){const v=parseInt(g('m'+id));if(!(v>=0)){msg.textContent='Escribí una cantidad válida.';return null}msg.textContent='';return v}
async function fin(error){msg.textContent=error?error.message:'';cargar()}
async function oro(id,s){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_oro',{p_user:id,p_delta:s*v})).error)}
async function fijar(id){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_fijar_oro',{p_user:id,p_oro:v})).error)}
async function regalar(id){const n=g('n'+id).trim();if(!n){msg.textContent='Escribí el nombre del ítem.';return}
 fin((await sb.rpc('dm_dar_item',{p_user:id,p_nombre:n,p_desc:g('d'+id).trim(),p_lugar:g('l'+id)})).error)}
async function regalarCat(id){const it=parseInt(g('c'+id));if(!it){msg.textContent='Elegí un ítem de la lista.';return}
 fin((await sb.rpc('dm_dar_catalogo',{p_user:id,p_item:it,p_lugar:g('l'+id)})).error)}
async function hp(id,s){const v=parseInt(g('h'+id));if(!(v>0)){msg.textContent='Escribí un número mayor a 0.';return}fin((await sb.rpc('dm_hp',{p_user:id,p_delta:s*v})).error)}
async function insp(id,d){fin((await sb.rpc('dm_inspiracion',{p_user:id,p_delta:d})).error)}
(async()=>{const p=await cabecera('Panel DM');if(!p)return;if(!p.is_dm){location.href='main.html';return}cargar()})();
</script></body></html>
