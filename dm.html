<!doctype html><html lang="es"><head><title>Valdoria - Panel DM</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>Panel del DM</h2>
<a class="btn" href="dm-catalogo.html">📚 Catálogo de ítems y mercaderes</a> <a class="btn" href="dm-novedades.html">📰 Novedades y alertas</a> <a class="btn" href="dm-registro.html">📋 Registro</a>
<div id="msg" class="err"></div>
<div id="lista"></div>
</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
async function cargar(){
 const{data:u}=await sb.from('profiles').select('*').order('username');
 const{data:i}=await sb.from('inventario').select('*').order('nombre');
 const{data:t}=await sb.from('items').select('id,nombre').order('nombre');
 const inv=i||[],opts=(t||[]).map(y=>'<option value="'+y.id+'">'+esc(y.nombre)+'</option>').join('');
 lista.innerHTML=(u||[]).map(x=>{
  const its=inv.filter(y=>y.user_id==x.id);
  return '<div class="box"><b>'+esc(x.username)+(x.is_dm?' (DM)':'')+'</b> · 💰 '+x.gold+' po<br>'+
   '<input type="number" id="m'+x.id+'" placeholder="Cantidad de oro" min="0">'+
   '<button onclick="oro(\''+x.id+'\',1)">Dar</button> <button onclick="oro(\''+x.id+'\',-1)">Quitar</button> <button onclick="fijar(\''+x.id+'\')">Fijar total</button>'+
   '<details><summary>Ítems ('+its.length+')</summary>'+(its.map(y=>esc(y.nombre)+' ('+y.lugar+')').join('<br>')||'<i>Vacío</i>')+'</details>'+
   '<select id="l'+x.id+'"><option value="cofre">Al cofre</option><option value="mochila">A la mochila</option></select><br>'+
   '<select id="c'+x.id+'">'+opts+'</select> <button onclick="regalarCat(\''+x.id+'\')">Dar del catálogo</button><br>'+
   '<input id="n'+x.id+'" placeholder="O un ítem suelto: nombre"><input id="d'+x.id+'" placeholder="Descripción">'+
   '<button onclick="regalar(\''+x.id+'\')">Dar ítem suelto</button></div>';
 }).join('');
}
const g=id=>document.getElementById(id).value;
function val(id){const v=parseInt(g('m'+id));if(!(v>=0)){msg.textContent='Escribí una cantidad válida.';return null}msg.textContent='';return v}
async function fin(error){msg.textContent=error?error.message:'';cargar()}
async function oro(id,s){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_oro',{p_user:id,p_delta:s*v})).error)}
async function fijar(id){const v=val(id);if(v===null)return;fin((await sb.rpc('dm_fijar_oro',{p_user:id,p_oro:v})).error)}
async function regalar(id){const n=g('n'+id).trim();if(!n){msg.textContent='Escribí el nombre del ítem.';return}
 fin((await sb.rpc('dm_dar_item',{p_user:id,p_nombre:n,p_desc:g('d'+id).trim(),p_lugar:g('l'+id)})).error)}
async function regalarCat(id){fin((await sb.rpc('dm_dar_catalogo',{p_user:id,p_item:parseInt(g('c'+id)),p_lugar:g('l'+id)})).error)}
(async()=>{const p=await cabecera('Panel DM');if(!p)return;if(!p.is_dm){location.href='main.html';return}cargar()})();
</script></body></html>
