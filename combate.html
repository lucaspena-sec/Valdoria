<script>
const OJOA='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z" fill="#fff" stroke="#222" stroke-width="2"/><circle cx="12" cy="12" r="3.5" fill="#222"/></svg>';
const OJOC='<svg width="18" height="18" viewBox="0 0 24 24"><path d="M2 11c3 5 7 7 10 7s7-2 10-7" fill="none" stroke="#fff" stroke-width="2"/><path d="M5 16l-2 3M12 18v3M19 16l2 3" stroke="#fff" stroke-width="2"/></svg>';
let ME=null,DM=false,ES={activo:false,ronda:1,turno:null},LISTA=[],CB=[],PF={},PERF=[],CR=[],F=null,ultTurno=null,pend=false,VC=true,VR=true,V3=false,V2=true,VIS={},COMP=new Set();
const gv=id=>document.getElementById(id).value;
const cl=(v,a,b)=>Math.max(a,Math.min(b,parseFloat(v)||a));
const aviso=e=>{msg.textContent=e?e.message:''};
const urlRet=id=>sb.storage.from('retratos').getPublicUrl(id+'.jpg').data.publicUrl;
const ord=(a,b)=>b.ini-a.ini||(b.dex||0)-(a.dex||0)||(a.tipo==b.tipo?0:a.tipo=='pj'?-1:1)||a.id-b.id;
const tirar20=m=>Math.floor(Math.random()*20)+1+m;
function rollDados(s){const r=String(s||'').match(/(\d+)\s*d\s*(\d+)\s*([+\-]\s*\d+)?/i);if(!r)return 0;let t=0;for(let i=0;i<+r[1];i++)t+=1+Math.floor(Math.random()*+r[2]);return Math.max(1,t+(r[3]?parseInt(r[3].replace(/\s/g,'')):0))}

/* ---------- datos ---------- */
function cDM(c){const pj=c.tipo=='pj',f=pj?PF[c.jugador]:null,p=pj?PERF.find(x=>x.id==c.jugador):null;
 return{id:c.id,tipo:c.tipo,ini:c.ini,dex:c.dex,jugador:c.jugador,alias:c.alias,real:c.nombre,cid:c.criatura_id,vs:c.ver_sangre??c.visible,vb:c.ver_barra??c.visible,vn:c.ver_nums??false,
  nombre:pj?((f&&f.datos&&f.datos.nombre)||(p&&p.nombre)||(p&&p.username)||'?'):(c.alias||c.nombre),
  imagen:pj?null:c.imagen,hp:pj?(f?f.hp:0):c.hp,hpmax:pj?(f?f.hp_max:1):c.hp_max,tmp:pj&&f?f.hp_temp:0,oculto:!c.visible,est:c.estados||[],vest:c.ver_est??true,vfi:c.ver_ficha??true}}
async function cargarDM(){
 const[e,c,f,p]=await Promise.all([sb.from('combate_estado').select('*').eq('id',1).maybeSingle(),sb.from('combatientes').select('*'),sb.from('fichas').select('user_id,hp,hp_max,hp_temp,datos'),sb.from('profiles').select('id,username,nombre,is_dm,es_actual,borrado_en').order('username')]);
 if(e.error||c.error){aviso(e.error||c.error);return false}
 ES=e.data||{activo:false,ronda:1,turno:null};CB=c.data||[];PF={};(f.data||[]).forEach(x=>PF[x.user_id]=x);PERF=(p.data||[]).filter(x=>x.es_actual!==false&&!x.borrado_en);
 LISTA=CB.map(cDM).sort(ord);return true}
async function cargarJug(){
 if(V2){
  const r=await sb.rpc('combate_ver2');
  if(!r.error&&r.data){const data=r.data;ES={activo:!!data.activo,ronda:data.ronda||1,turno:data.turno};LISTA=data.lista||[];TIR={};COMP=new Set();
   LISTA.forEach(x=>{if(x.jugador&&x.tir)TIR[x.jugador]={u:x.jugador,d:x.tir.d,t:x.tir.t,ts:x.tir.ts};if(x.jugador&&x.comp)COMP.add(x.jugador)});return true}
  if(r.error&&!/combate_ver2|could not find|PGRST202|does not exist/i.test(r.error.message||'')){aviso(r.error);return false}
  V2=false} /* sin el SQL nuevo: se usa el camino anterior */
 const{data,error}=await sb.rpc('combate_ver');if(error){aviso(error);return false}
 ES={activo:!!data.activo,ronda:data.ronda||1,turno:data.turno};LISTA=data.lista||[];return true}
async function cargar(){
 let ok;
 if(DM)[ok]=await Promise.all([cargarDM(),cargarTir()]);
 else{ok=await cargarJug();if(ok&&!V2){await Promise.all([cargarTir(),cargarVis(),cargarComp()]);normalizarLegacy()}}
 if(!ok)return;
 pintar();if(!DM)await cargarMio()}

/* ---------- pantalla ---------- */
function pintar(){pintarTurno();pintarBar();pintarGrid();if(DM)pintarPrep();else pintarDadosVis()}
function pintarTurno(){
 if(!ES.activo){turnoEl.innerHTML=DM?'Combate sin iniciar. Armalo en la preparación y tocá "Iniciar combate".':'No hay un combate en curso.';return}
 const t=LISTA.find(x=>x.id==ES.turno),mio=!DM&&t&&t.jugador==ME.id;
 const lst=t?estLista(t.est):[],et=(lst.length&&(DM||mio))?'<div class="turnoEst">'+lst.map(e=>ESTK[e.k].ic+' <b>'+esc(ESTK[e.k].n)+(e.k=='agotado'?' '+e.n:'')+'</b>: '+esc(uni(estResumen(e)))).join('<br>')+'</div>':'';
 turnoEl.innerHTML='<b>Ronda '+ES.ronda+'</b> · Turno de: <b>'+esc(t?t.nombre:'—')+'</b>'+(mio?' <span class="miturno">¡ES TU TURNO!</span>':'')+et+(mio?'<div class="pasar"><button id="pasarBtn" onclick="pasarTurno()">➡ Pasar turno</button></div>':'');
 if(mio&&ES.turno!=ultTurno&&navigator.vibrate)navigator.vibrate([200,100,200]);
 ultTurno=ES.turno}
function pintarBar(){if(!DM)return;
 dmBar.style.display='block';
 dmBar.innerHTML=ES.activo?'<button onclick="anterior()" title="Vuelve al turno anterior (por si se pasó sin querer)">⬅ Turno anterior</button> <button onclick="siguiente()">➡ Siguiente turno</button> <button onclick="terminar()">🏁 Terminar combate</button>':'<button onclick="iniciar()" style="font-size:16px;padding:10px 22px">⚔ Iniciar combate</button>'}
function carta(it,dm){
 const pj=it.tipo=='pj',full=dm||(pj&&it.jugador==ME.id),vi=full?{s:1,b:1,n:1}:{s:it.s??(pj||!it.oculto),b:it.b??(pj||!it.oculto),n:it.n??pj};
 const pct=full?(it.hpmax>0?it.hp/it.hpmax*100:100):(it.pct!=null?it.pct:(it.hp!=null&&it.hpmax>0?it.hp/it.hpmax*100:null));
 const st=((full||vi.s)&&pct!=null)?(pct<=0?4:pct<=25?3:pct<=50?2:pct<=75?1:0):0;
 const ec=estCard(it),turno=ES.activo&&ES.turno==it.id,img=pj?urlRet(it.jugador):it.imagen,tir=pj?TIR[it.jugador]:null,nl=it.nombre.length+(turno?2:0),nc=nl>20?' l':nl>12?' m':'';
  const tb=it.tmp>0?'<div class="cbar t"><div class="fill azul" style="width:'+Math.min(100,it.tmp/Math.max(1,it.hpmax)*100)+'%"></div></div>':'';
  let bar;
  if(full&&pj)bar='<div class="cbar"><div class="fill rojo" style="width:'+cl(pct,0,100)+'%"></div><span>'+it.hp+'/'+it.hpmax+(it.tmp?' +'+it.tmp:'')+'</span></div>'+tb;
  else if(full)bar='<div class="cbar"><div class="fill rojo" style="width:'+cl(pct,0,100)+'%"></div><span>'+it.hp+'/'+it.hpmax+'</span></div>';
  else if(vi.b&&pct!=null)bar='<div class="cbar"><div class="fill rojo" style="width:'+cl(pct,0,100)+'%"></div>'+(vi.n&&it.hp!=null?'<span>'+it.hp+'/'+it.hpmax+(it.tmp?' +'+it.tmp:'')+'</span>':'')+'</div>'+(vi.n?tb:'');
  else if(vi.s)bar='<div class="cbarx"></div>';
  else bar='<div class="cbar"><span>?</span></div>';
 return '<div class="ccard '+(pj?'cpj':'ccr')+(turno?' turno':'')+(dm&&it.oculto?' ocultoDM':'')+ec.cls+'"'+ec.st+'><div class="cfoto"><div class="ph">'+(pj?'🧙':'👹')+'</div>'+
  (img?'<img src="'+esc(img)+'" alt="" onerror="this.style.display=\'none\'">':'')+
  '<svg viewBox="0 0 100 120" preserveAspectRatio="none">'+sangreSvg(st)+'</svg>'+ec.fx+'<span class="cini">'+it.ini+'</span>'+(tir?'<div class="cdado">'+dadoHtml(tir,18)+'</div>':'')+
   (dm?(V3?vis3(it):(pj?'':'<button class="ojoC" title="Mostrar u ocultar su vida a los jugadores" onclick="verC('+it.id+')">'+(it.oculto?OJOC:OJOA)+'</button>')):'')+
  '</div>'+ec.row+'<div class="cnombre'+nc+'"><span>'+(turno?'▶ ':'')+esc(it.nombre)+'</span></div>'+bar+(dm?ctlDM(it):'')+(dm&&!pj?'<button class="cfbtn" onclick="verFicha('+it.id+')">📜 Ficha</button>':'')+(!dm&&!pj&&it.bes?'<button class="cfbtn" onclick="verBes('+it.bes+')">📖 Ficha</button>':'')+(pj&&(dm||(it.jugador!=ME.id&&COMP.has(it.jugador)))?'<button class="cfbtn" onclick="verFichaPJ(\''+it.jugador+'\')">📜 Ficha</button>':'')+'</div>'}
function ctlDM(it){const id=it.id,pj=it.tipo=='pj';
 return '<details class="cdm" id="d'+id+'"><summary>⚙ Controles</summary>'+
  'Iniciativa <input type="number" id="in'+id+'" value="'+it.ini+'" style="width:60px" onchange="setIni('+id+',this.value)"><br>'+
  '<input type="number" id="hn'+id+'" min="1" placeholder="PV" style="width:60px"><button onclick="hpC('+id+',-1)">−</button><button onclick="hpC('+id+',1)">+</button>'+
  (pj?'':'<br>Nombre visible <input id="al'+id+'" value="'+esc(it.alias||'')+'" placeholder="'+esc(it.real)+'" onchange="setAlias('+id+',this.value)">')+
  crCtl(it)+estCtl(it)+'<br><button onclick="quitarC('+id+')">✖ Quitar</button></details>'}
function pintarGrid(){
 if(!ES.activo&&!DM){grid.innerHTML='';return}
 const a=document.activeElement;if(a&&grid.contains(a)&&a.tagName=='INPUT')return;
 const ab=[...grid.querySelectorAll('details[open]')].map(d=>d.id);
 HAYEST=LISTA.some(x=>x.est&&x.est.length);grid.innerHTML=LISTA.map(it=>carta(it,DM)).join('')||'<i>No hay combatientes todavía.</i>';
 ab.forEach(id=>{const e=document.getElementById(id);if(e)e.open=true})}

/* ---------- acciones del DM ---------- */
async function q(p){const{error}=await p;aviso(error);await cargar()}
const upd=(id,o)=>q(sb.from('combatientes').update(o).eq('id',id));
const setIni=(id,v)=>upd(id,{ini:parseInt(v)||0});
function setAlias(id,v){v=v.trim();const c=CB.find(x=>x.id==id),o={alias:v},oculta=!!(v&&FI_OK&&c&&c.ver_ficha!==false);
 if(oculta)o.ver_ficha=false;
 upd(id,o).then(()=>{if(oculta)aviso({message:'Le cambiaste el nombre: su ficha del bestiario quedó oculta a los jugadores. Destildá 🎭 cuando quieras revelarla.'})})}
function verC(id){const c=CB.find(x=>x.id==id);if(c)upd(id,{visible:!c.visible})}
async function quitarC(id){if(!confirm('¿Quitar del combate?'))return;const c=CB.find(x=>x.id==id),im=c?c.imagen:'';await q(sb.from('combatientes').delete().eq('id',id));limpiarSkins([im])}
function hpC(id,s){const n=parseInt(gv('hn'+id));if(!(n>0)){aviso({message:'Escribí un número mayor a 0.'});return}
 const c=CB.find(x=>x.id==id);if(!c)return;
 if(c.tipo=='pj')return q(sb.rpc('dm_hp',{p_user:c.jugador,p_delta:s*n}));
 upd(id,{hp:cl(c.hp+s*n,0,c.hp_max)})}
const nomPJ=p=>(PF[p.id]&&PF[p.id].datos&&PF[p.id].datos.nombre)?PF[p.id].datos.nombre+' ('+p.username+')':(p.nombre&&p.nombre!==p.username?p.nombre+' ('+p.username+')':p.username);
const dexPJ=id=>md(((PF[id]&&PF[id].datos&&PF[id].datos.car)||{}).des??10);
function pintarPrep(){
 const a=document.activeElement;if(a&&prep.contains(a)&&a.tagName=='INPUT'&&a.type!='checkbox')return;
 const gd={};document.querySelectorAll('#pjs input[type=number]').forEach(e=>gd[e.id]=e.value);
 pjs.innerHTML=PERF.filter(p=>!p.is_dm).map(p=>{const c=CB.find(x=>x.tipo=='pj'&&x.jugador==p.id);
  return '<div class="fila"><input type="checkbox" style="width:auto;margin:0" '+(c?'checked':'')+' onchange="togglePJ(\''+p.id+'\',this.checked)"> <span class=\"pn\">'+esc(nomPJ(p))+'</span><span style="margin-left:auto">Ini <input type="number" id="pi'+p.id+'" value="'+(c?c.ini:'')+'" style="width:56px;margin:0" onchange="iniPJ(\''+p.id+'\',this.value)"> <button style="padding:0 6px" onclick="tirarPJ(\''+p.id+'\')">🎲</button></span></div>'}).join('')||'<i>No hay jugadores.</i>';
 Object.keys(gd).forEach(k=>{const e=document.getElementById(k);if(e&&!e.value)e.value=gd[k]})}
async function togglePJ(id,on){
 if(on){const p=PERF.find(x=>x.id==id);await q(sb.from('combatientes').insert({tipo:'pj',jugador:id,nombre:p?p.username:'pj',ini:parseInt(gv('pi'+id))||0,dex:dexPJ(id)}))}
 else{const c=CB.find(x=>x.tipo=='pj'&&x.jugador==id);if(c)await q(sb.from('combatientes').delete().eq('id',c.id))}}
function iniPJ(id,v){const c=CB.find(x=>x.tipo=='pj'&&x.jugador==id);if(c)upd(c.id,{ini:parseInt(v)||0})}
function tirarPJ(id){const r=tirar20(dexPJ(id));document.getElementById('pi'+id).value=r;iniPJ(id,r)}
function opcionesCR(){const b=crq.value.trim().toLowerCase(),v=crs.value;
 crs.innerHTML=CR.filter(c=>!b||c.nombre.toLowerCase().includes(b)).map(c=>'<option value="'+c.id+'">'+esc(c.nombre)+' · '+esc(c.tipo)+' · VD '+esc((c.datos||{}).vd||'?')+'</option>').join('')||'<option value="">(sin resultados)</option>';
 if([...crs.options].some(o=>o.value==v))crs.value=v}
async function agregarC(){const c=CR.find(x=>x.id==parseInt(crs.value));if(!c){aviso({message:'Elegí una criatura de la lista.'});return}
 const n=cl(cant.value,1,20),d=c.datos||{},dex=md((d.car||{}).des??10),filas=[],modo=pgmax.checked?'max':tpg.checked?'tirar':'prom';
 for(let i=1;i<=n;i++){const hp=pgCalc(d,modo),ini=cini.value.trim()===''?tirar20(dex):(parseInt(cini.value)||0);
  filas.push({tipo:'criatura',criatura_id:c.id,nombre:n>1?c.nombre+' '+i:c.nombre,imagen:c.imagen||'',hp,hp_max:hp,ini,dex,visible:true,...v3k(true,true,false),...pgk(modo),...fik(true)})}
 await q(sb.from('combatientes').insert(filas))}
const ahora=()=>new Date().toISOString();
async function iniciar(){const vivos=LISTA.filter(x=>!(x.tipo=='criatura'&&x.hp<=0));if(!vivos.length){aviso({message:'Agregá combatientes primero.'});return}
 await sb.rpc('tiradas_limpiar');
 await q(sb.from('combate_estado').update({activo:true,ronda:1,turno:vivos[0].id,actualizado:ahora()}).eq('id',1))}
async function siguiente(){const l=LISTA;if(!l.length)return;let i=l.findIndex(x=>x.id==ES.turno),ronda=ES.ronda,n=0;
 do{i++;if(i>=l.length){i=0;ronda++}n++}while(n<=l.length&&l[i].tipo=='criatura'&&l[i].hp<=0);
 await sb.rpc('tiradas_limpiar');
 await q(sb.from('combate_estado').update({turno:l[i].id,ronda,actualizado:ahora()}).eq('id',1))}
async function pasarTurno(){
 const b=document.getElementById('pasarBtn');if(b)b.disabled=true;
 const{error}=await sb.rpc('pasar_turno');
 if(error){aviso(error);if(b)b.disabled=false;return}
 aviso(null);await cargar()}
async function anterior(){const l=LISTA;if(!l.length)return;let i=l.findIndex(x=>x.id==ES.turno),ronda=ES.ronda,n=0;
 do{i--;if(i<0){i=l.length-1;ronda=Math.max(1,ronda-1)}n++}while(n<=l.length&&l[i].tipo=='criatura'&&l[i].hp<=0);
 await sb.rpc('tiradas_limpiar');
 await q(sb.from('combate_estado').update({turno:l[i].id,ronda,actualizado:ahora()}).eq('id',1))}
async function terminar(){if(!confirm('¿Terminar el combate? Se quitan todos los combatientes.'))return;const skins=CB.map(c=>c.imagen);
 await sb.from('combatientes').delete().gte('id',0);await sb.rpc('tiradas_limpiar');
 await q(sb.from('combate_estado').update({activo:false,ronda:1,turno:null,actualizado:ahora()}).eq('id',1));limpiarSkins(skins)}

/* ---------- PG por criatura, y foto temporal (skin) ---------- */
let PG_OK=false,SKALL=true,FI_OK=false;
async function probarFI(){const{error}=await sb.from('combatientes').select('ver_ficha').limit(1);FI_OK=!error}
const fik=v=>FI_OK?{ver_ficha:v}:{};
const ocultaFicha=(id,on)=>upd(id,{ver_ficha:!on});
async function probarPG(){const{error}=await sb.from('combatientes').select('pg_modo').limit(1);PG_OK=!error}
const pgk=m=>PG_OK?{pg_modo:m}:{};
function maxDados(s){let t=0,ok=false;const r=String(s||'').replace(/(\d+)\s*d\s*(\d+)/gi,(m,n,c)=>{t+=n*c;ok=true;return ''});
 if(!ok)return 0;(r.match(/[+\-]\s*\d+/g)||[]).forEach(x=>{t+=parseInt(x.replace(/\s/g,''))});return Math.max(1,t)}
function pgCalc(d,m){d=d||{};
 if(m=='max')return Math.max(1,maxDados(d.dados)||d.pg||1);
 if(m=='tirar')return Math.max(1,rollDados(d.dados)||d.pg||1);
 return Math.max(1,d.pg||1)}
const setPgModo=(id,m)=>upd(id,{pg_modo:m});
function pgAplicar(id){const c=CB.find(x=>x.id==id);if(!c)return;const cr=CR.find(x=>x.id==c.criatura_id);
 if(!cr){aviso({message:'Esa criatura ya no está en el bestiario.'});return}
 if(!confirm('¿Recalcular los PG de '+(c.alias||c.nombre)+'? Se pierde el daño que ya tiene.'))return;
 const hp=pgCalc(cr.datos,c.pg_modo||'prom');upd(id,{hp,hp_max:hp})}
/* skin: la foto subida vive en el almacén "items" con nombre skin-… y se borra cuando ya nadie la usa */
const esSkin=u=>/\/items\/skin-[^\/?]+(\?.*)?$/.test(u||'');
const skinNom=u=>decodeURIComponent(u.split('/').pop().split('?')[0]);
async function limpiarSkins(urls){
 try{const usadas=new Set(CB.map(c=>c.imagen)),n=[...new Set((urls||[]).filter(u=>esSkin(u)&&!usadas.has(u)).map(skinNom))];
  if(n.length)await sb.storage.from('items').remove(n)}catch(e){}}
async function barrerSkins(){
 try{const b=sb.storage.from('items'),{data}=await b.list('',{limit:100,search:'skin-'});
  const n=(data||[]).map(x=>x.name).filter(x=>/^skin-/.test(x));if(n.length)await b.remove(n)}catch(e){}}
async function comprimirFoto(file,max){
 let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error('formato de imagen no válido'));i.src=URL.createObjectURL(file)})}

function dadoSvg(c,v,s,solo){
 let fill='#1d1830';if(c==20&&solo){if(v==20)fill='#1e7b34';else if(v==1)fill='#8b1a1a'}
 const f=c==100?'<circle cx="12" cy="12" r="11" fill="'+fill+'" stroke="#ffd54a" stroke-width="1.5"/>':'<polygon points="'+FORMA[c]+'" fill="'+fill+'" stroke="#ffd54a" stroke-width="1.5" stroke-linejoin="round"/>';
 const fs=v>=100?8:v>=10?10:12,y=(c==4?15:12)+fs*0.35;
 return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" style="position:static;width:'+s+'px;height:'+s+'px;flex:none">'+f+(v==null?'':'<text x="12" y="'+y.toFixed(1)+'" text-anchor="middle" font-size="'+fs+'" font-weight="bold" fill="#fff" font-family="Arial,sans-serif">'+v+'</text>')+'</svg>'}
function dadoHtml(t,s){
 const todos=[];(t.d||[]).forEach(g=>(g.v||[]).forEach(v=>todos.push([g.c,v])));
 const solo=todos.length==1,mx=12;
 return '<div class="cds">'+todos.slice(0,mx).map(x=>dadoSvg(x[0],x[1],s,solo)).join('')+(todos.length>mx?'<b class="mas">+'+(todos.length-mx)+'</b>':'')+'</div><div class="ctot">= '+t.t+'</div>'}
async function cargarTir(){

 if(error||!Array.isArray(data))return true; /* sin el SQL de dados, el combate sigue igual */

const totalBD=()=>CARAS.reduce((a,c)=>a+(BD[c]||0),0);

function pintarDadosVis(){

function pintarBand(){

async function tirarDados(){
 if(rolling)return;
 if(!totalBD()){aviso({message:'Tocá al menos un dado.'});return}
 if(!ES.activo){aviso({message:'No hay un combate en curso.'});return}
 rolling=true;const bt=document.getElementById('dTirar'),dr=document.getElementById('dRes');bt.disabled=true;
 const pedido={},caras=[];CARAS.forEach(c=>{if(BD[c]){pedido[c]=BD[c];for(let i=0;i<BD[c];i++)caras.push(c)}});
 const ani=setInterval(()=>{dr.innerHTML='<div class="cds">'+caras.slice(0,12).map(c=>dadoSvg(c,1+Math.floor(Math.random()*c),26)).join('')+'</div>'},90);
 const t0=Date.now(),{data,error}=await sb.rpc('tirar_dados',{p_dados:pedido});
 await new Promise(r=>setTimeout(r,Math.max(0,700-(Date.now()-t0))));
 clearInterval(ani);rolling=false;bt.disabled=false;
 if(error||!data){aviso(error||{message:'No se pudo tirar.'});dr.innerHTML='';dKey='';return}

/* ---------- loot (solo DM) ---------- */
let LT={oro:'',modoOro:'iguales',items:[],sel:{},pre:null,saved:[],cat:[],q:'',fc:'',fr:'',edit:null,inf:'',ask:true};
const barajar=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const ltJug=()=>PERF.filter(p=>!p.is_dm);
const ltNom=id=>{const p=PERF.find(x=>x.id==id);return p?nomPJ(p):'(jugador)'};
const ltSel=()=>ltJug().filter(p=>LT.sel[p.id]).map(p=>p.id);
function ltDefecto(p){const f=PF[p.id],vivo=!!(f&&f.hp>0),enC=CB.filter(c=>c.tipo=='pj');return enC.length?(vivo&&!!enC.find(c=>c.jugador==p.id)):vivo}
function ltSync(forzar){ltJug().forEach(p=>{if(forzar||!(p.id in LT.sel))LT.sel[p.id]=ltDefecto(p)})}
async function ltIniciar(){
 const[a,b]=await Promise.all([sb.from('items').select('id,nombre,categoria,rareza').order('nombre'),sb.from('loots').select('*').order('nombre')]);

 try{LT.ask=localStorage.getItem('lootAsk')!=='0'}catch(e){}
 ltSync(true);ltPintar();
 loot.addEventListener('toggle',()=>{if(loot.open){ltSync(false);ltPintar()}})}
async function ltRecargar(){const b=await sb.from('loots').select('*').order('nombre');LT.saved=b.error?null:(b.data||[]);ltPintar()}

/* reparto: oro en partes iguales (el resto, de a 1 moneda, a jugadores sorteados) e ítems parejos */
function ltPlan(oro,modoOro,items,selIds){
 const ids=barajar(selIds),n=ids.length,por={},adv=[];ids.forEach(u=>por[u]={oro:0,items:[]});
 const T=Math.max(0,parseInt(oro)||0);
 if(T&&n){if(modoOro=='cada')ids.forEach(u=>por[u].oro=T);else{const base=Math.floor(T/n),r=T%n;ids.forEach((u,i)=>por[u].oro=base+(i<r?1:0))}}
 const pool=[];
 items.forEach(l=>{const c=Math.max(1,parseInt(l.cant)||1),it={id:l.id,nombre:l.nombre};
  if(l.modo=='cada')ids.forEach(u=>{for(let k=0;k<c;k++)por[u].items.push(it)});
  else if(l.modo=='para'){if(l.para&&por[l.para]){for(let k=0;k<c;k++)por[l.para].items.push(it)}else adv.push('"'+l.nombre+'" va para alguien que no está seleccionado: no se entrega.')}
  else for(let k=0;k<c;k++)pool.push(it)});
 barajar(pool).forEach((x,i)=>por[ids[i%n]].items.push(x));
 return{orden:ids,por,adv}}
function ltAgrupar(a){const m={};a.forEach(x=>m[x.nombre]=(m[x.nombre]||0)+1);return Object.entries(m).map(([n,c])=>(c>1?c+'× ':'')+esc(n)).join(', ')}
function ltResumen(P){return P.orden.map(u=>{const r=P.por[u];return ltNom(u)+': '+[r.oro?r.oro+' de oro':'',r.items.length?ltAgrupar(r.items).replace(/&amp;/g,'&'):''].filter(Boolean).join(', ')||'nada'}).join('\n')}

function ltPreHtml(){const P=LT.pre;if(!P)return '';
 return '<div class="ltpre"><b>👁 Vista previa</b>'+P.orden.map(u=>{const r=P.por[u];return '<div class="ltrow"><b class="pn">'+esc(ltNom(u))+'</b>'+(r.oro?'<span>🪙 '+r.oro+'</span>':'')+(r.items.length?'<span>'+ltAgrupar(r.items)+'</span>':'')+(!r.oro&&!r.items.length?'<i>nada</i>':'')+'</div>'}).join('')+
  (P.adv.length?'<div class="ltadv">'+P.adv.map(x=>esc(x)).join('<br>')+'</div>':'')+
  '<div class="ltrow" style="margin-top:6px"><button onclick="ltVista()">🎲 Volver a sortear</button><button onclick="ltConfirmar()"><b>✔ Confirmar y dar</b></button><button onclick="LT.pre=null;ltPintar()">Cancelar</button></div></div>'}
function ltInval(){LT.pre=null;const p=document.getElementById('ltPre');if(p)p.innerHTML=''}
function ltRes(){const el=document.getElementById('ltRes');if(!el)return;
 const q=LT.q.trim().toLowerCase(),r=LT.cat.filter(i=>(!q||i.nombre.toLowerCase().includes(q))&&(!LT.fc||i.categoria==LT.fc)&&(!LT.fr||i.rareza==LT.fr));
 el.innerHTML=!LT.cat.length?'<i>No hay ítems en el catálogo.</i>':!r.length?'<i>Sin resultados.</i>':
  r.slice(0,30).map(i=>'<div class="ltrow"><span class="pn">'+esc(i.nombre)+' <small>'+esc(CATN[i.categoria]||'')+' · '+esc(RARN[i.rareza]||'')+'</small></span><button onclick="ltAdd(\''+i.id+'\')">＋</button></div>').join('')+(r.length>30?'<small>Mostrando 30 de '+r.length+': afiná la búsqueda.</small>':'')}
function ltPintar(){
 const el=document.getElementById('lootBody');if(!el)return;
 const js=ltJug(),enC=CB.filter(c=>c.tipo=='pj');
 const op=(o,v)=>Object.entries(o).map(([k,t])=>'<option value="'+k+'"'+(v==k?' selected':'')+'>'+t+'</option>').join('');
 let h='<h4>👥 Para quién</h4><div class="ltrow"><button onclick="ltSobrev()">❤ Sobrevivientes</button><button onclick="ltTodos(true)">Todos</button><button onclick="ltTodos(false)">Ninguno</button></div>';
 h+=js.map(p=>{const f=PF[p.id],hp=f?f.hp+'/'+f.hp_max:'sin ficha',vivo=f&&f.hp>0,en=enC.find(c=>c.jugador==p.id);
  return '<label class="ltrow"><input type="checkbox" style="width:auto;margin:0" '+(LT.sel[p.id]?'checked':'')+' onchange="ltTog(\''+p.id+'\',this.checked)"> <span class="pn">'+esc(nomPJ(p))+'</span><small>'+(en?'⚔ ':'')+(vivo?'❤ ':'💀 ')+hp+'</small></label>'}).join('')||'<i>No hay jugadores.</i>';
 h+='<h4>🪙 Oro</h4><div class="ltrow"><input type="number" id="ltOro" min="0" placeholder="0" value="'+esc(LT.oro)+'" oninput="LT.oro=this.value;ltInval()"><select onchange="LT.modoOro=this.value;ltInval()">'+op({iguales:'Partes iguales',cada:'X a cada uno'},LT.modoOro)+'</select></div><small>En partes iguales, lo que sobra se reparte de a 1 moneda a jugadores sorteados.</small>';
 h+='<h4>🎒 Ítems</h4><div class="ltrow"><input id="ltQ" placeholder="Buscar ítem" value="'+esc(LT.q)+'" oninput="LT.q=this.value;ltRes()"><select onchange="LT.fc=this.value;ltRes()"><option value="">Todas las categorías</option>'+op(CATN,LT.fc)+'</select><select onchange="LT.fr=this.value;ltRes()"><option value="">Toda rareza</option>'+op(RARN,LT.fr)+'</select></div><div id="ltRes" class="ltres"></div>';
 h+='<h5 style="margin:8px 0 2px">Lo que se va a repartir</h5>'+(LT.items.length?LT.items.map((l,i)=>'<div class="ltrow"><b class="pn">'+esc(l.nombre)+'</b><span>×</span><input type="number" min="1" max="99" value="'+l.cant+'" oninput="ltCant('+i+',this.value)"><select onchange="ltModo('+i+',this.value)">'+op({repartir:'Repartir',cada:'A cada uno',para:'Para…'},l.modo)+'</select>'+
  (l.modo=='para'?'<select onchange="ltPara('+i+',this.value)"><option value="">¿Quién?</option>'+js.filter(p=>LT.sel[p.id]).map(p=>'<option value="'+p.id+'"'+(l.para==p.id?' selected':'')+'>'+esc(nomPJ(p))+'</option>').join('')+'</select>':'')+
  '<button onclick="ltQuitar('+i+')">✖</button></div>').join(''):'<i>Todavía no agregaste ítems.</i>');
 h+='<div class="ltrow" style="margin-top:8px"><button onclick="ltVista()">👁 Vista previa</button><button onclick="ltGuardar()">💾 '+(LT.edit?'Actualizar “'+esc(LT.edit.nombre)+'”':'Guardar como loot')+'</button>'+(LT.edit?'<button onclick="ltSoltar()">Nuevo</button>':'')+'</div>';
 h+='<div id="ltPre">'+ltPreHtml()+'</div><div id="ltInf">'+LT.inf+'</div>';
 h+='<h4>📦 Loots preparados</h4><label><input type="checkbox" style="width:auto" '+(LT.ask?'':'checked')+' onchange="ltAsk(this.checked)"> Dar sin confirmar</label>';
 h+=LT.saved===null?'<br><i>Para guardar loots corré setup_loot.sql en Supabase.</i>':(LT.saved.length?LT.saved.map(l=>{const d=l.datos||{},n=(d.items||[]).length;return '<div class="ltrow"><b class="pn">'+esc(l.nombre)+' <small>'+((d.oro&&d.oro.monto)?'🪙 '+d.oro.monto+' · ':'')+n+' ítem'+(n==1?'':'s')+'</small></b><button onclick="ltDar('+l.id+')">▶ Dar</button><button onclick="ltCargar('+l.id+')" title="Cargar para editar">✏</button><button onclick="ltDup('+l.id+')" title="Duplicar">📄</button><button onclick="ltBorrar('+l.id+')" title="Borrar">🗑</button></div>'}).join(''):'<br><i>Todavía no guardaste loots.</i>');
 el.innerHTML=h;ltRes()}
function ltTog(u,on){LT.sel[u]=on;ltInval();ltPintar()}
function ltTodos(on){ltJug().forEach(p=>LT.sel[p.id]=on);ltInval();ltPintar()}
function ltSobrev(){ltSync(true);ltInval();ltPintar()}
function ltCant(i,v){LT.items[i].cant=Math.max(1,parseInt(v)||1);ltInval()}
function ltModo(i,v){LT.items[i].modo=v;ltInval();ltPintar()}
function ltPara(i,v){LT.items[i].para=v;ltInval()}
function ltQuitar(i){LT.items.splice(i,1);ltInval();ltPintar()}
function ltAdd(id){const it=LT.cat.find(x=>String(x.id)==String(id));if(!it)return;
 const ya=LT.items.find(l=>String(l.id)==String(id)&&l.modo!='para');if(ya)ya.cant++;else LT.items.push({id:it.id,nombre:it.nombre,cant:1,modo:'repartir',para:''});
 ltInval();ltPintar()}
function ltAsk(v){LT.ask=!v;try{localStorage.setItem('lootAsk',LT.ask?'1':'0')}catch(e){}}
function ltVista(){const sel=ltSel();
 if(!sel.length){aviso({message:'Elegí al menos un jugador.'});return}
 if(!(parseInt(LT.oro)||0)&&!LT.items.length){aviso({message:'Poné algo de oro o agregá ítems.'});return}
 aviso(null);LT.pre=ltPlan(LT.oro,LT.modoOro,LT.items,sel);ltPintar()}
async function ltConfirmar(){if(LT.pre)await ltEntregar(LT.pre,true)}
async function ltEntregar(plan,desdeArmado){
 const entregas=plan.orden.map(u=>({user:u,oro:plan.por[u].oro,items:plan.por[u].items.map(x=>x.id)})).filter(e=>e.oro>0||e.items.length);
 if(!entregas.length){aviso({message:'No hay nada para entregar.'});return}
 const{data,error}=await sb.rpc('repartir_loot',{p_plan:{entregas}});
 if(error){aviso(error);return}
 aviso(null);ltInforme(data,desdeArmado)}
function ltInforme(data,desdeArmado){
 const inf=(data&&data.informe)||[],pen={};let h='<div class="ltpre"><b>✅ Loot entregado</b>';
 inf.forEach(r=>{
  h+='<div class="ltrow"><b class="pn">'+esc(ltNom(r.user))+'</b>'+(r.error?'<span>⚠ '+esc(r.error)+'</span>':'')+(r.oro?'<span>🪙 +'+r.oro+'</span>':'')+
   (r.entregados&&r.entregados.length?'<span>'+Object.values(r.entregados.reduce((m,x)=>{const k=x.nombre+'|'+x.lugar;(m[k]=m[k]||{...x,c:0}).c++;return m},{})).map(x=>(x.c>1?x.c+'× ':'')+esc(x.nombre)+' <small>('+esc(x.lugar)+')</small>').join(', ')+'</span>':'')+
   (r.pendientes&&r.pendientes.length?'<span class="ltadv">⚠ Sin entregar: '+r.pendientes.map(x=>esc(x.nombre)+' ('+esc(x.motivo)+')').join(', ')+'</span>':'')+'</div>';
  (r.pendientes||[]).forEach(x=>{const k=r.user+'|'+x.id;pen[k]=pen[k]||{id:x.id,nombre:x.nombre,user:r.user,cant:0};pen[k].cant++})});
 h+='</div>';LT.inf=h;LT.pre=null;
 if(desdeArmado){LT.oro='';LT.items=[]}
 const pp=Object.values(pen);pp.forEach(p=>LT.items.push({id:p.id,nombre:p.nombre,cant:p.cant,modo:'para',para:p.user}));
 if(pp.length)LT.inf+='<small>Lo que no entró quedó en “Lo que se va a repartir”, para el mismo jugador, para reintentar cuando libere lugar.</small>';
 ltPintar()}
const ltDatos=()=>({oro:{monto:Math.max(0,parseInt(LT.oro)||0),modo:LT.modoOro},items:LT.items.filter(l=>l.modo!='para').map(l=>({id:l.id,nombre:l.nombre,cant:l.cant,modo:l.modo}))});
async function ltGuardar(){
 const d=ltDatos(),excl=LT.items.length-d.items.length;
 if(!d.oro.monto&&!d.items.length){aviso({message:'No hay nada para guardar.'});return}
 const nombre=(prompt('Nombre del loot',LT.edit?LT.edit.nombre:'')||'').trim();if(!nombre)return;
 const r=LT.edit?await sb.from('loots').update({nombre,datos:d}).eq('id',LT.edit.id):await sb.from('loots').insert({nombre,datos:d});
 if(r.error){aviso(r.error);return}
 aviso(excl?{message:'Guardado. Los ítems con “Para…” no se guardan en un loot (los jugadores cambian).'}:null);LT.edit=null;await ltRecargar()}
function ltSoltar(){LT.edit=null;ltPintar()}
function ltCargar(id){const l=LT.saved.find(x=>x.id==id);if(!l)return;const d=l.datos||{};
 LT.oro=d.oro&&d.oro.monto?String(d.oro.monto):'';LT.modoOro=(d.oro&&d.oro.modo)||'iguales';
 LT.items=(d.items||[]).map(x=>({id:x.id,nombre:x.nombre,cant:x.cant||1,modo:x.modo=='cada'?'cada':'repartir',para:''}));
 LT.edit={id:l.id,nombre:l.nombre};ltInval();ltPintar()}
async function ltDup(id){const l=LT.saved.find(x=>x.id==id);if(!l)return;
 const r=await sb.from('loots').insert({nombre:l.nombre+' (copia)',datos:l.datos});if(r.error){aviso(r.error);return}aviso(null);await ltRecargar()}
async function ltBorrar(id){const l=LT.saved.find(x=>x.id==id);if(!l||!confirm('¿Borrar el loot “'+l.nombre+'”?'))return;
 const r=await sb.from('loots').delete().eq('id',id);if(r.error){aviso(r.error);return}aviso(null);if(LT.edit&&LT.edit.id==id)LT.edit=null;await ltRecargar()}
async function ltDar(id){const l=LT.saved.find(x=>x.id==id);if(!l)return;
 const sel=ltSel();if(!sel.length){aviso({message:'Elegí al menos un jugador.'});return}
 const d=l.datos||{},plan=ltPlan(d.oro?d.oro.monto:0,d.oro?d.oro.modo:'iguales',(d.items||[]).map(x=>({id:x.id,nombre:x.nombre,cant:x.cant||1,modo:x.modo=='cada'?'cada':'repartir'})),sel);
 if(LT.ask&&!confirm('¿Dar “'+l.nombre+'”?\n\n'+ltResumen(plan)))return;
 await ltEntregar(plan,false)}

async function cargarVis(){const{data,error}=await sb.rpc('combate_vis');if(error||!Array.isArray(data))return true;const n={};data.forEach(x=>n[x.id]=x);VIS=n;return true}
function normalizarLegacy(){LISTA.forEach(it=>{if(it.tipo=='pj'){it.s=it.b=it.n=true;return}
 const v=VIS[it.id];if(v){it.s=v.s;it.b=v.b;it.n=v.n;if(v.hp!=null){it.hp=v.hp;it.hpmax=v.hpmax}}else{it.s=it.b=!it.oculto;it.n=false}})}
async function cargarComp(){const{data,error}=await sb.rpc('fichas_compartidas');if(error||!Array.isArray(data))return true;COMP=new Set(data);return true}
const vis3=it=>'<div class="vis3">'+[['s','🩸','Sangre',it.vs],['b','📊','Barra de vida',it.vb],['n','🔢','Números de la barra',it.vn]].map(([k,ic,t,on])=>
 '<button class="vb'+(on?' on':'')+(k=='n'&&!it.vb?' dis':'')+'" title="'+t+': '+(on?'los jugadores lo ven':'oculto para los jugadores')+'" onclick="v3('+it.id+',\''+k+'\')">'+ic+'</button>').join('')+'</div>';
function v3(id,k){const c=CB.find(x=>x.id==id);if(!c)return;
 let s=c.ver_sangre??c.visible,b=c.ver_barra??c.visible,n=c.ver_nums??false;
 if(k=='s')s=!s;
 else if(k=='b'){b=!b;if(!b)n=false}
 else{if(!b){aviso({message:'Prendé primero la barra para poder mostrar los números.'});return}n=!n}
 aviso(null);upd(id,{ver_sangre:s,ver_barra:b,ver_nums:n,visible:s||b})}

function abrirHoja(tit,pg,html){
