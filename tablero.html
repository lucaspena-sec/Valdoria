<!doctype html><html lang="es"><head><title>Valdoria - Tablero</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css?v=23"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js?v=14"></script>
<style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}
/* tablero: todos los estilos viven acá para no tener que subir la versión de style.css */
#vista{position:relative;height:66vh;height:66dvh;min-height:280px;background:#14110b;border:3px ridge #c9a227;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#vista:fullscreen{height:100vh;border:0}
#mundo{position:absolute;left:0;top:0;transform-origin:0 0;background:#2a2418;will-change:transform}
#bgBox{position:absolute;inset:0;overflow:hidden}
#bgBox img,#bgBox video{display:block;width:100%;height:100%;pointer-events:none;-webkit-user-drag:none}
#svg{position:absolute;left:0;top:0;overflow:hidden;pointer-events:none}
#fichasEl{position:absolute;inset:0;pointer-events:none}
.ficha{position:absolute;transform:translate(-50%,-50%);border-radius:50%;border:3px solid var(--c);background:#000b;display:flex;align-items:center;justify-content:center;pointer-events:auto;cursor:pointer;touch-action:none}
#fichasEl.mov .ficha{transition:left .15s,top .15s}
.ficha.sel{box-shadow:0 0 0 3px #ffd54a,0 0 16px 5px #ffd54a}
.ficha.drag{z-index:5;cursor:grabbing;transition:none!important;opacity:.9}
.ficha .em{line-height:1;pointer-events:none}
.ficha .nm{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:2px;background:#000c;color:#fff;font-weight:bold;padding:0 4px;white-space:nowrap;pointer-events:none;border-radius:3px}
#zctl{position:absolute;right:6px;top:6px;z-index:10;display:flex;flex-direction:column;gap:4px}
#zctl button{margin:0;width:38px;height:38px;padding:0;font-size:18px}
.trow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0}
.trow label{display:flex;align-items:center;gap:6px}
.trow input[type=range]{width:100%;padding:0}
.tcol{flex:1 1 220px;min-width:0}
#estado{margin-top:6px;font-size:13px}
</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>🗺 Tablero</h2>
<a href="escenario.html">← Volver a Escenario</a>
<div id="msg" class="err"></div>
<details class="box"><summary><b>⚙ Ajustes del tablero</b></summary>
 <div class="trow"><button id="bForma"></button><button id="bOri"></button>
  <label><input type="checkbox" id="verC" style="width:auto;margin:0"> Mostrar cuadrícula</label>
  <label>Color <input type="color" id="colC" style="width:48px;height:34px;padding:0;margin:0"></label></div>
 <div class="trow">
  <div class="tcol"><label>Tamaño de celda: <b id="sizeL"></b></label><input type="range" id="sizeR" min="24" max="140" step="2"></div>
  <div class="tcol"><label>Opacidad de las líneas</label><input type="range" id="alR" min="5" max="100"></div></div>
 <div class="trow">
  <div class="tcol"><label>Mover la cuadrícula ←→</label><input type="range" id="oxR" min="-140" max="140"></div>
  <div class="tcol"><label>Mover la cuadrícula ↑↓</label><input type="range" id="oyR" min="-140" max="140"></div></div>
 <small>Cada celda vale 5 pies. Si tu mapa ya trae su propia cuadrícula, ajustá tamaño y posición hasta que coincidan.</small>
 <h4>Fondo</h4>
 <div class="trow"><input type="file" id="fileIn" accept="image/*,video/*"></div>
 <div class="trow"><input id="urlIn" placeholder="O pegá la URL de una foto, GIF o video (mp4/webm)" style="flex:1 1 220px;width:auto"><button id="bUrl">Usar URL</button><button id="bQuitarBg">Quitar fondo</button></div>
 <h4>Fichas</h4>
 <div class="trow"><button id="bPJ">＋ PJ</button><button id="bCR">＋ Criatura</button><button id="bTam">⇔ Tamaño de la elegida</button><button id="bRen">✏ Renombrar</button><button id="bDel">🗑 Quitar</button></div>
</details>
<div id="vista">
 <div id="mundo"><div id="bgBox"></div><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div id="fichasEl"></div></div>
 <div id="zctl"><button id="zMas" title="Acercar">＋</button><button id="zMenos" title="Alejar">−</button><button id="zFit" title="Ver todo el tablero">⤢</button><button id="bFs" title="Pantalla completa">⛶</button></div>
</div>
<div id="estado" class="box"></div>
</div></div>
<script src="tablero.js?v=1"></script></body></html>
