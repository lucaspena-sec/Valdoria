<!doctype html><html lang="es"><head><title>Valdoria - Tienda</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script><script src="app.js"></script><style>/* FONDO: reemplazá none por url("fondo.jpg") */:root{--fondo:none}</style></head><body>
<div class="win"><div id="cab"></div><div class="body">
<h2>Tienda</h2>
<div class="tabs" id="tabs"></div>
<div id="info" class="box"></div>
<div class="carr" id="carr"></div>
<div id="msg" class="err"></div>
</div></div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const url=u=>esc((u||'').replace(/'/g,'%27'));
const RN={comun:'Común',infrecuente:'Infrecuente',rara:'Rara',epica:'Épica',legendaria:'Legendaria'};
let ME=[],OF=[],actual=0;
async function iniciar(){
 const a=await sb.from('mercaderes').select('*').eq('activo',true).order('id');
 const b=await sb.from('oferta').select('mercader_id,items(*)');
 ME=a.data||[];OF=b.data||[];dibujar()}
function dibujar(){
 if(!ME.length){tabs.innerHTML='';info.innerHTML='<i>No hay mercaderes disponibles por ahora.</i>';carr.innerHTML='';return}
 if(actual>=ME.length)actual=0;
 tabs.innerHTML=ME.map((m,i)=>'<button class="'+(i==actual?'on':'')+'" onclick="actual='+i+';dibujar()">'+esc(m.nombre)+'</button>').join('');
 const m=ME[actual];
 info.innerHTML=(m.imagen?'<img src="'+esc(m.imagen)+'" width="64" height="64" style="object-fit:cover;vertical-align:middle;border:2px inset #fff" onerror="this.remove()"> ':'')+'<b>'+esc(m.nombre)+'</b> - '+esc(m.titulo)+'<br><small>Deslizá para ver más productos →</small>';
 const its=OF.filter(o=>o.mercader_id==m.id&&o.items).map(o=>o.items);
 carr.innerHTML=its.map(it=>'<div class="item r-'+it.rareza+'"><div class="ifoto" style="background-image:url(\''+url(it.imagen)+'\')"></div><h3>'+esc(it.nombre)+'</h3><small>'+RN[it.rareza]+'</small><p>'+esc(it.descripcion)+'</p><p class="precio">'+it.precio+' po</p><button onclick="comprar('+m.id+','+it.id+',this)">Comprar</button></div>').join('')||'<i>Este mercader no tiene nada para vender.</i>';
}
async function comprar(mid,iid,b){
 msg.className='err';msg.textContent='';b.disabled=true;
 const it=OF.find(o=>o.items&&o.items.id==iid).items;
 const{data,error}=await sb.rpc('comprar_item',{p_mercader:mid,p_item:iid});
 b.disabled=false;
 if(error){msg.textContent=error.message;return}
 oro.textContent=data;msg.className='ok';msg.textContent='Compraste: '+it.nombre+' (está en tu mochila)';
}
cabecera('Tienda');iniciar();
</script></body></html>
